body{margin:0;background:#fff;color:#222;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{width:min(92vw,720px);margin:0 auto;padding:42px 0 60px;text-align:center}

.result{margin:22px auto 0;padding:20px;border:1px solid #eee;border-radius:16px;max-width:460px;background:#fff}
.score{font-size:48px;font-weight:800;line-height:1.1;margin:5px 0 10px}
.bar{height:9px;background:#eee;border-radius:99px;overflow:hidden}
.fill{height:100%;width:0;background:#222;transition:width .4s}
.msg{margin-top:10px;color:#777;font-size:14px}

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const clearBtn = document.getElementById("clear");
const gradeBtn = document.getElementById("grade");
const result = document.getElementById("result");
const scoreEl = document.getElementById("score");
const fill = document.getElementById("fill");
const msg = document.getElementById("msg");

let strokes = [], current = [], drawing = false, pointerId = null;

function draw() {
  ctx.clearRect(0,0,840,840);
  ctx.save();
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  // 원본 외곽선 기준선
  ctx.strokeStyle = "rgba(70,70,70,.22)";
  ctx.lineWidth = 5;
  ctx.setLineDash([7,8]);
  ctx.beginPath();
  ref.forEach((p,i) => i ? ctx.lineTo(p[0],p[1]) : ctx.moveTo(p[0],p[1]));
  ctx.closePath();
  ctx.stroke();
  ctx.setLineDash([]);

  // 사용자가 그린 선
  ctx.strokeStyle = "#222";
  ctx.lineWidth = 5;
  for (const s of strokes) {
    ctx.beginPath();
    s.forEach((p,i) => i ? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y));
    ctx.stroke();
  }
  if (current.length) {
    ctx.beginPath();
    current.forEach((p,i) => i ? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y));
    ctx.stroke();
  }
  ctx.restore();
}

function pos(e) {
  const r = canvas.getBoundingClientRect();
  return {x:(e.clientX-r.left)*840/r.width, y:(e.clientY-r.top)*840/r.height};
}

function down(e) {
  if (drawing) return;
  drawing = true; pointerId = e.pointerId;
  current = [pos(e)];
  canvas.setPointerCapture(pointerId);
  result.hidden = true;
  gradeBtn.disabled = false;
  draw();
}
function move(e) {
  if (!drawing || e.pointerId !== pointerId) return;
  const p = pos(e), q = current[current.length-1];
  if (Math.hypot(p.x-q.x,p.y-q.y) >= 2) current.push(p);
  draw();
}
function up(e) {
  if (!drawing || e.pointerId !== pointerId) return;
  drawing = false;
  if (current.length > 2) strokes.push(current);
  current = []; pointerId = null;
  draw();
}

function pointSegDistance(p,a,b) {
  const dx=b.x-a.x, dy=b.y-a.y, l2=dx*dx+dy*dy;
  if (!l2) return Math.hypot(p.x-a.x,p.y-a.y);
  let t=((p.x-a.x)*dx+(p.y-a.y)*dy)/l2;
  t=Math.max(0,Math.min(1,t));
  return Math.hypot(p.x-(a.x+t*dx),p.y-(a.y+t*dy));
}
function minDist(p,path) {
  let best=Infinity;
  for(let i=1;i<path.length;i++) best=Math.min(best,pointSegDistance(p,path[i-1],path[i]));
  return best;
}
function userLength(path) {
  let d=0; for(let i=1;i<path.length;i++) d+=Math.hypot(path[i].x-path[i-1].x,path[i].y-path[i-1].y);
  return d;
}
function refLength() {
  let d=0;
  for(let i=0;i<ref.length;i++) {
    const a=ref[i],b=ref[(i+1)%ref.length];
    d+=Math.hypot(b[0]-a[0],b[1]-a[1]);
  }
  return d;
}

function grade() {
  const user=strokes.flat();
  if(user.length<25) {
    scoreEl.textContent="—"; fill.style.width="0%";
    msg.textContent="외곽선을 조금 더 따라 그려주세요.";
    result.hidden=false; return;
  }
  const refPath=ref.map(p=>({x:p[0],y:p[1]}));
  let targetErr=0;
  for(const p of refPath) targetErr += minDist(p,user);
  targetErr/=refPath.length;

  let userErr=0;
  for(let i=0;i<user.length;i+=Math.max(1,Math.floor(user.length/240)))
    userErr += minDist(user[i],refPath);
  userErr/=Math.ceil(user.length/Math.max(1,Math.floor(user.length/240)));

  const proximity=Math.max(0,1-targetErr/42);
  const coverage=Math.max(0,1-userErr/48);
  const lenScore=Math.max(0,1-Math.abs(userLength(user)-refLength())/refLength());
  const score=Math.round(Math.max(0,Math.min(100,(proximity*.65+coverage*.22+lenScore*.13)*100)));

  scoreEl.textContent=score+"점";
  fill.style.width=score+"%";
  msg.textContent =
    score>=95 ? "완벽한 우주하마에 가깝습니다!" :
    score>=85 ? "상당히 정확합니다!" :
    score>=70 ? "오, 우주하마 느낌은 납니다!" :
    score>=50 ? "조금 삐뚤빼뚤하지만 우주하마입니다." :
    "우주하마가 조금 당황했습니다…";
  result.hidden=false;
}

clearBtn.addEventListener("click",()=>{
  strokes=[]; current=[]; drawing=false; gradeBtn.disabled=true;
  result.hidden=true; draw();
});
gradeBtn.addEventListener("click",grade);
canvas.addEventListener("pointerdown",down);
canvas.addEventListener("pointermove",move);
canvas.addEventListener("pointerup",up);
canvas.addEventListener("pointercancel",up);
draw();
</script>
