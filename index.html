<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HAMA DRAWING</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#222;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{width:min(94vw,1100px);margin:auto;padding:40px 0 60px;text-align:center}
.game-layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:28px;align-items:start;text-align:center}
.left-panel{min-width:0}
.right-panel{min-width:0}
h1{margin:0;font-size:34px;letter-spacing:-1.5px}
.sub{margin:8px 0 22px;color:#777;font-size:15px}
.board{width:min(100%,680px);aspect-ratio:1;margin:auto;border:1px solid #e6e6e6;border-radius:20px;overflow:hidden;background:#fafafa;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.tools{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:15px auto 0}
.tool{display:flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid #e3e3e3;border-radius:12px;background:#fff;font-size:13px;color:#555}
input[type=color]{width:34px;height:34px;border:0;padding:0;background:none;cursor:pointer}
input[type=text]{width:88px;border:0;outline:0;font:inherit;color:#333}
button{border:1px solid #ddd;background:#fff;border-radius:12px;padding:12px 19px;font-size:15px;font-weight:700;cursor:pointer}
button.primary{background:#222;color:#fff;border-color:#222}
button:disabled{opacity:.4;cursor:not-allowed}
.buttons{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.result{margin:0 0 18px;padding:20px;border:1px solid #eee;border-radius:16px;background:#fff}
.score{font-size:50px;font-weight:850;line-height:1.05;margin:4px 0 10px}
.bar{height:9px;background:#eee;border-radius:99px;overflow:hidden}
.fill{height:100%;width:0;background:#222;transition:width .35s}
.msg{margin-top:10px;color:#777;font-size:14px}
.records{margin:0;text-align:left;border:1px solid #eee;border-radius:16px;padding:16px;background:#fff}
.records h2{font-size:15px;margin:0 0 8px}
.record-row{display:flex;justify-content:space-between;padding:7px 0;color:#666;font-size:13px}
.note{margin-top:15px;color:#aaa;font-size:12px}

@media (max-width:860px){
  .wrap{width:min(94vw,680px);padding-top:28px}
  .game-layout{grid-template-columns:1fr;gap:22px}
  .right-panel{width:100%}
  .result{margin-bottom:14px}
}

@media (max-width:520px){
  h1{font-size:28px}
  .sub{font-size:14px;margin-bottom:20px}
  .board{border-radius:16px}
  .buttons button{padding:11px 14px;font-size:14px}
  .score{font-size:44px}
}
</style>
</head>
<body>
<main class="wrap">

  <h1>🦛 HAMA DRAWING</h1>
  <div class="sub">우주하마의 외곽선을 따라 그려보세요!</div>

  <div class="game-layout">

    <div class="left-panel">

      <div class="board">
        <canvas id="c" width="840" height="840" aria-label="우주하마 따라그리기"></canvas>
      </div>

      <div class="tools">
        <div class="tool">
          <span>펜 색</span>
          <input id="color" type="color" value="#7092BE" aria-label="펜 색상">
          <input id="hex" type="text" value="#7092BE" maxlength="7" aria-label="색상 코드">
        </div>
        <button type="button" id="preset">청회색 #7092BE</button>
      </div>

      <div class="buttons">
        <button type="button" id="clear">다시 그리기</button>
        <button type="button" id="grade" class="primary" disabled>채점하기</button>
        <button type="button" id="save" disabled>내 그림 저장하기</button>
      </div>

    </div>

    <div class="right-panel">

      <section class="result" id="result" hidden aria-live="polite">
        <div>우주하마 싱크로율</div>
        <div class="score" id="score">0.0점</div>
        <div class="bar">
          <div class="fill" id="fill"></div>
        </div>
        <div class="msg" id="msg"></div>
      </section>

      <section class="records" id="records">
        <h2>내 기록</h2>
        <div id="recordList"></div>
      </section>

    </div>

  </div>

  <div class="note">저장한 PNG에는 가이드라인이 포함되지 않습니다.</div>

</main>

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const clearBtn = document.getElementById("clear");
const gradeBtn = document.getElementById("grade");
const saveBtn = document.getElementById("save");
const colorInput = document.getElementById("color");
const hexInput = document.getElementById("hex");
const presetBtn = document.getElementById("preset");
const result = document.getElementById("result");
const scoreEl = document.getElementById("score");
const fill = document.getElementById("fill");
const msg = document.getElementById("msg");
const recordList = document.getElementById("recordList");

let strokes = [];
let current = [];
let drawing = false;
let pointerId = null;
let penColor = "#7092BE";
let lastScore = null;

function validHex(v) {
  return /^#[0-9a-fA-F]{6}$/.test(v);
}

function setColor(v) {
  if (!validHex(v)) return;
  penColor = v.toUpperCase();
  colorInput.value = penColor;
  hexInput.value = penColor;
  draw();
}

colorInput.addEventListener("input", () => setColor(colorInput.value));

hexInput.addEventListener("change", () => {
  let v = hexInput.value.trim();
  if (v[0] !== "#") v = "#" + v;
  if (validHex(v)) setColor(v);
  else hexInput.value = penColor;
});

presetBtn.addEventListener("click", () => setColor("#7092BE"));

function draw() {
  ctx.clearRect(0,0,840,840);

  ctx.save();
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  ctx.strokeStyle = "rgba(70,70,70,.23)";
  ctx.lineWidth = 5;
  ctx.setLineDash([7,8]);
  ctx.beginPath();

  ref.forEach((p,i) =>
    i ? ctx.lineTo(p[0],p[1]) : ctx.moveTo(p[0],p[1])
  );

  ctx.closePath();
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.strokeStyle = penColor;
  ctx.lineWidth = 5;

  for (const s of strokes) {
    ctx.beginPath();
    s.forEach((p,i) =>
      i ? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y)
    );
    ctx.stroke();
  }

  if (current.length) {
    ctx.beginPath();
    current.forEach((p,i) =>
      i ? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y)
    );
    ctx.stroke();
  }

  ctx.restore();
}

function pos(e) {
  const r = canvas.getBoundingClientRect();
  return {
    x:(e.clientX-r.left)*840/r.width,
    y:(e.clientY-r.top)*840/r.height
  };
}

function down(e) {
  if (drawing) return;

  drawing=true;
  pointerId=e.pointerId;
  current=[pos(e)];

  canvas.setPointerCapture(pointerId);

  result.hidden=true;
  gradeBtn.disabled=false;
  saveBtn.disabled=false;

  draw();
}

function move(e) {
  if (!drawing || e.pointerId!==pointerId) return;

  const p=pos(e);
  const q=current[current.length-1];

  if (Math.hypot(p.x-q.x,p.y-q.y)>=1.5) {
    current.push(p);
  }

  draw();
}

function up(e) {
  if (!drawing || e.pointerId!==pointerId) return;

  drawing=false;

  if (current.length>2) {
    strokes.push(current);
  }

  current=[];
  pointerId=null;

  draw();
}

function pathLength(path) {
  let d=0;

  for(let i=1;i<path.length;i++) {
    d+=Math.hypot(
      path[i].x-path[i-1].x,
      path[i].y-path[i-1].y
    );
  }

  return d;
}

function closedRefLength() {
  let d=0;

  for(let i=0;i<ref.length;i++) {
    const a=ref[i];
    const b=ref[(i+1)%ref.length];

    d+=Math.hypot(
      b[0]-a[0],
      b[1]-a[1]
    );
  }

  return d;
}

function resampleOpen(path,n) {
  if(path.length<2) return [];

  const lens=[0];
  let total=0;

  for(let i=1;i<path.length;i++) {
    total+=Math.hypot(
      path[i].x-path[i-1].x,
      path[i].y-path[i-1].y
    );

    lens.push(total);
  }

  if(total<=0) return [];

  const out=[];

  for(let k=0;k<n;k++) {
    const target=total*k/(n-1);

    let i=1;

    while(i<lens.length && lens[i]<target) {
      i++;
    }

    i=Math.min(i,lens.length-1);

    const a=path[i-1];
    const b=path[i];

    const seg=lens[i]-lens[i-1];
    const t=seg ? (target-lens[i-1])/seg : 0;

    out.push({
      x:a.x+(b.x-a.x)*t,
      y:a.y+(b.y-a.y)*t
    });
  }

  return out;
}

function cyclicError(u,r,reverse) {
  const n=r.length;
  let best=Infinity;

  for(let shift=0;shift<n;shift++) {
    let sum=0;

    for(let i=0;i<n;i++) {
      const j=reverse
        ? (shift-i+n*2)%n
        : (shift+i)%n;

      sum += Math.hypot(
        u[i].x-r[j][0],
        u[i].y-r[j][1]
      );
    }

    best=Math.min(best,sum/n);
  }

  return best;
}

function grade() {
  const user=strokes.flat();

  if(user.length<30) {
    scoreEl.textContent="—";
    fill.style.width="0%";
    msg.textContent="외곽선을 조금 더 따라 그려주세요.";
    result.hidden=false;
    return;
  }

  const u=resampleOpen(user,360);
  const r=ref;

  const e1=cyclicError(u,r,false);
  const e2=cyclicError(u,r,true);
  const shapeErr=Math.min(e1,e2);

  let coverageErr=0;

  const step=Math.max(
    1,
    Math.floor(user.length/360)
  );

  for(let i=0;i<user.length;i+=step) {
    let best=Infinity;

    for(const p of r) {
      best=Math.min(
        best,
        Math.hypot(
          user[i].x-p[0],
          user[i].y-p[1]
        )
      );
    }

    coverageErr+=best;
  }

  coverageErr/=Math.ceil(user.length/step);

  const lengthScore=Math.max(
    0,
    1-Math.abs(
      pathLength(user)-closedRefLength()
    )/closedRefLength()
  );

  const shapeScore=Math.max(
    0,
    1-shapeErr/55
  );

  const coverageScore=Math.max(
    0,
    1-coverageErr/55
  );

  const raw=(
    shapeScore*.62+
    coverageScore*.25+
    lengthScore*.13
  )*100;

  const score=Math.round(
    Math.max(0,Math.min(100,raw))*10
  )/10;

  lastScore=score;

  scoreEl.textContent=score.toFixed(1)+"점";
  fill.style.width=score+"%";

  msg.textContent =
    score>=97 ? "거의 우주하마 본인이 그린 수준입니다!" :
    score>=90 ? "엄청 정확합니다!" :
    score>=80 ? "상당히 닮았습니다!" :
    score>=70 ? "오, 우주하마 느낌은 납니다!" :
    score>=50 ? "조금 삐뚤빼뚤하지만 우주하마입니다." :
    "누구세요?";

  result.hidden=false;

  saveRecord(score);
}

function saveRecord(score) {
  try {
    const arr=JSON.parse(
      localStorage.getItem("hamaScores")||"[]"
    );

    arr.push({
      score,
      at:new Date().toISOString()
    });

    arr.sort((a,b)=>b.score-a.score);

    localStorage.setItem(
      "hamaScores",
      JSON.stringify(arr.slice(0,10))
    );

    renderRecords();

  } catch(e) {}
}

function renderRecords() {
  let arr=[];

  try {
    arr=JSON.parse(
      localStorage.getItem("hamaScores")||"[]"
    );
  } catch(e) {}

  recordList.innerHTML="";

  if(!arr.length) {
    recordList.innerHTML=
      '<div class="record-row"><span>아직 기록이 없습니다.</span><span>—</span></div>';

    return;
  }

  arr.slice(0,5).forEach((x,i)=>{
    const row=document.createElement("div");

    row.className="record-row";

    row.innerHTML=
      '<span>'+ (i+1) +'위</span><strong>'+
      Number(x.score).toFixed(1)+
      '점</strong>';

    recordList.appendChild(row);
  });
}

function exportPNG() {
  if(!strokes.length || lastScore === null) return;

  const out=document.createElement("canvas");

  out.width=840;
  out.height=1040;

  const o=out.getContext("2d");

  o.fillStyle="#ffffff";
  o.fillRect(
    0,
    0,
    out.width,
    out.height
  );

  o.fillStyle="#222";
  o.textAlign="center";
  o.font="bold 28px sans-serif";

  o.fillText(
    "🦛 HAMA DRAWING",
    420,
    42
  );

  o.fillStyle="#777";
  o.font="15px sans-serif";

  o.fillText(
    "우주하마의 외곽선을 따라 그려보세요!",
    420,
    68
  );

  o.save();

  o.translate(0,90);

  o.strokeStyle=penColor;
  o.lineWidth=5;
  o.lineCap="round";
  o.lineJoin="round";

  for(const s of strokes) {
    o.beginPath();

    s.forEach((p,i)=>
      i
        ? o.lineTo(p.x,p.y)
        : o.moveTo(p.x,p.y)
    );

    o.stroke();
  }

  o.restore();

  o.fillStyle="#f7f8fa";

  o.beginPath();

  o.roundRect(
    40,
    900,
    760,
    105,
    16
  );

  o.fill();

  o.fillStyle="#555";
  o.font="bold 17px sans-serif";

  o.fillText(
    "우주하마 싱크로율",
    420,
    928
  );

  o.fillStyle="#222";
  o.font="bold 38px sans-serif";

  o.fillText(
    Number(lastScore).toFixed(1)+"점",
    420,
    970
  );

  o.fillStyle="#777";
  o.font="14px sans-serif";

  const message =
    lastScore>=97 ? "거의 우주하마 본인이 그린 수준입니다!" :
    lastScore>=90 ? "엄청 정확합니다!" :
    lastScore>=80 ? "상당히 닮았습니다!" :
    lastScore>=70 ? "오, 우주하마 느낌은 납니다!" :
    lastScore>=50 ? "조금 삐뚤빼뚤하지만 우주하마입니다." :
    "누구세요?";

  o.fillText(
    message,
    420,
    994
  );

  const a=document.createElement("a");

  a.download="hama-drawing-result.png";
  a.href=out.toDataURL("image/png");

  a.click();
}

clearBtn.addEventListener("click",()=>{
  strokes=[];
  current=[];
  drawing=false;
  lastScore=null;

  gradeBtn.disabled=true;
  saveBtn.disabled=true;
  result.hidden=true;

  draw();
});

gradeBtn.addEventListener("click",grade);
saveBtn.addEventListener("click",exportPNG);

canvas.addEventListener("pointerdown",down);
canvas.addEventListener("pointermove",move);
canvas.addEventListener("pointerup",up);
canvas.addEventListener("pointercancel",up);

renderRecords();
draw();

</script>
</body>
</html>
